<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Tech Secure | Remote Diagnostics & Triage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased">

    <!-- Header Section -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-blue-400">IT TECH SECURE</h1>
            <div class="text-sm text-gray-400">
                Direct Line: <span class="text-white font-semibold">862-436-7086</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-6 py-12">
        
        <!-- Hero / Service Intro -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold mb-3">Remote IT Triage & Diagnostics</h2>
            <p class="text-gray-400 max-w-xl mx-auto">
                Submit your system specs and error details below for professional expert review. Instant webhook dispatch to our engineering desk.
            </p>
            <div class="mt-4 inline-block bg-blue-950/60 border border-blue-800 text-blue-300 px-4 py-1.5 rounded-full text-sm font-medium">
                Flat Triage Fee: $49.00
            </div>
        </div>

        <!-- Triage Form Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            <form id="triageForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Your Name & Phone</label>
                    <input type="text" name="name" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-blue-500" placeholder="John Doe / 555-0199">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                    <input type="email" name="email" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-blue-500" placeholder="client@example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">System Specs / Operating System</label>
                    <input type="text" name="os_specs" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-blue-500" placeholder="Windows 11 Pro / Ubuntu 24.04 / Custom Rig">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Describe the Issue / Error Codes</label>
                    <textarea name="message" rows="4" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-blue-500" placeholder="Blue screen on boot, network card dropping packets, high CPU utilization..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition duration-200 shadow-lg">
                    Submit Triage Request ($49 Fee)
                </button>
                
                <p id="formStatus" class="text-sm text-center mt-3 font-medium"></p>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-xs text-gray-600 border-t border-gray-900 mt-12">
        &copy; 2026 IT Tech Secure. Newark, New Jersey. All rights reserved.
    </footer>

    <!-- Script to Handle Discord Webhook & Redirect -->
    <script>
    document.getElementById('triageForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const status = document.getElementById('formStatus');
        const btn = document.getElementById('submitBtn');

        btn.disabled = true;
        btn.textContent = 'Transmitting to Triage Desk...';

        try {
            // REPLACE WITH YOUR ACTUAL DISCORD WEBHOOK URL
            const discordWebhookUrl = 'https://discord.com/api/webhooks/1525528528504885410/BGvNyfjTUWoflTtoBbI7Dljg4p-I6ku9jL2x8lVJkUpnfSLPws0YXxFctkzUMDl6Tj3E'; 
            
            const discordPayload = {
                content: "🚨 **New Remote IT Triage Request Received!**",
                embeds: [{
                    title: "Client Triage Submission",
                    color: 3447003, // Blue
                    fields: [
                        { name: "👤 Client Name & Phone", value: data.name, inline: true },
                        { name: "📧 Email", value: data.email, inline: true },
                        { name: "💻 System / OS", value: data.os_specs, inline: false },
                        { name: "📝 Issue Description", value: data.message, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            const response = await fetch(discordWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(discordPayload)
            });

            if (!response.ok) {
                throw new Error('Discord webhook dispatch failed');
            }

            status.textContent = 'Request received! Redirecting to secure payment...';
            status.className = 'text-sm text-center mt-3 text-green-400 font-medium';

            // REPLACE WITH YOUR STRIPE OR PAYPAL PAYMENT LINK
            setTimeout(() => {
                window.location.href = 'https://your-stripe-payment-link-here'; 
            }, 1500);

        } catch (error) {
            status.textContent = 'Submission error. Please call directly at 862-436-7086.';
            status.className = 'text-sm text-center mt-3 text-red-400 font-medium';
            btn.disabled = false;
            btn.textContent = 'Submit Triage Request ($49 Fee)';
        }
    });
    </script>
</body>
</html>
